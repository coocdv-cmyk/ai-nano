name: OMEGA-NANO CI

on:
  push:
    branches: ["master", "main", "research/*"]
  pull_request:
    branches: ["master", "main"]

jobs:
  agent-and-core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fast,brain,dev]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run core, agent, memory, security, and brain test suite
        run: |
          python -m pytest tests/test_brain.py tests/test_core.py tests/test_engine.py tests/test_llm.py tests/test_memory.py tests/test_reasoner.py tests/test_recovery.py tests/test_security.py tests/test_state.py tests/test_tools.py -q
      - name: Verify CLI health
        run: |
          python -m omega_nano doctor
          python -m omega_nano tools
